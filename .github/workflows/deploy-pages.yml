name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Instalar o pnpm
        uses: pnpm/action-setup@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar testes
        run: pnpm test

      - name: Compilar a extensão
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar a versão publicada
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_CACHE_KEY: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs
